; Worker queue Juki Tools
; Simpan ke: /etc/supervisor/conf.d/tools-worker.conf
; Lalu: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start tools-worker:*
;
; Sesuaikan /path/ke/tools dan user dengan server produksi.

[program:tools-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/ke/tools/artisan queue:work database --sleep=3 --tries=3 --timeout=240 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
startsecs=0
redirect_stderr=true
stdout_logfile=/path/ke/tools/storage/logs/worker.log
stopwaitsecs=3600
